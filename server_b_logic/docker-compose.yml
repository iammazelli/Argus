services:
  mysql:
    image: mysql:8.0
    container_name: argus-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: root@argus2024
      MYSQL_DATABASE: ArgusDB
      MYSQL_USER: argus
      MYSQL_PASSWORD: argus@2024
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - argus-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "argus", "-pargus@2024"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.25-alpine
    container_name: argus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - mysql
    networks:
      - argus-net

# A seção networks deve ficar isolada na raiz do arquivo
networks:
  argus-net:
    name: argus-shared-net
    driver: bridge

volumes:
  mysql-data: