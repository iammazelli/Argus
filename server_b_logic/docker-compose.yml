services:
  mysql:
    image: mysql:8.0
    container_name: argus-mysql
    restart: unless-stopped
    env_file: [../.env]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      # Cria o usuário do backend por padrão
      MYSQL_USER: ${DB_BACKEND_USER}
      MYSQL_PASSWORD: ${DB_BACKEND_USER_PASSWORD}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - server_b_logic_mysql-data:/var/lib/mysql

  frontend-api:
    build: .
    container_name: argus-frontend-api
    restart: unless-stopped
    env_file: [../.env]
    environment:
      - DB_HOST_INTERNAL=argus-mysql

  nginx:
    image: nginx:1.25-alpine
    container_name: argus-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-api

volumes:
  server_b_logic_mysql-data: