
services:
  emqx:
    image: emqx/emqx:5.1.0
    container_name: argus-broker
    hostname: emqx
    restart: unless-stopped
    environment:
      - "EMQX_ALLOW_ANONYMOUS=true"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=${MQTT_PASSWORD}"
    ports:
      - "${MQTT_PORT_TCP}:1883"
      - "${MQTT_PORT_DASHBOARD}:18083"
    networks: [argus-shared-net]

  backend:
    build: .
    container_name: argus-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:3000"
    env_file: [../.env]
    environment:
      - DB_HOST=argus-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - MQTT_URL=mqtt://emqx:1883
      - MQTT_USER=${MQTT_USERNAME}
      - MQTT_PASS=${MQTT_PASSWORD}
    networks: [argus-shared-net]

networks:
  argus-shared-net:
    external: true
    name: argus-shared-net